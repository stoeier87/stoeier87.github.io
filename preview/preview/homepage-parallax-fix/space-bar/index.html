<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>The Space Bar — Tobias Fullerton Støier</title>
    <meta
      name="description"
      content="Forty cocktails, one per real star. Pan the star map, pick a star, get the recipe. Every recipe serves two."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="servicedesign.dk" />
    <meta property="og:url" content="https://stoeier.dk/space-bar/" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:title" content="The Space Bar" />
    <meta
      property="og:description"
      content="Forty cocktails, one per real star. Pan the star map, pick a star, get the recipe. Every recipe serves two."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Space Bar" />
    <meta
      name="twitter:description"
      content="Forty cocktails, one per real star. Pan the star map, pick a star, get the recipe. Every recipe serves two."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="../css/all.min.css" rel="stylesheet" />
    <script type="module" crossorigin src="../assets/space-bar/index-CFo0_LIP.js"></script>
    <link rel="modulepreload" crossorigin href="../assets/tailwind-CQTSFH_G.js">
    <link rel="stylesheet" crossorigin href="../assets/tailwind-Bi-9WWH3.css">
    <link rel="stylesheet" crossorigin href="../assets/index-CqsPp965.css">
  </head>
  <body>
    <!-- Far background: drifting starfield and the occasional UFO -->
    <canvas id="backdrop" aria-hidden="true"></canvas>

    <!-- ── Bar ───────────────────────────────────────────────── -->
    <div class="bar" id="bar">
      <header class="bar-nav">
        <a class="pill back" href="../" aria-label="Back to homepage" title="Back to homepage">
          <span class="arrow"><i class="fa-solid fa-arrow-left-long"></i></span>
        </a>
      </header>

      <!-- The pannable field. Stars are injected here. -->
      <div class="viewport" id="viewport">
        <div class="map" id="map">
          <div class="blackhole" id="blackhole" aria-hidden="true"></div>
          <div class="rocket" id="rocket" aria-hidden="true">
            <svg viewBox="0 0 24 40" width="22" height="36">
              <path d="M12 0c5 7 7.5 14 7.5 22 0 4.5-1 8-2.5 10h-10C5.5 30 4.5 26.5 4.5 22 4.5 14 7 7 12 0Z" fill="#c9d2e2"/>
              <path d="M7.5 26 1 34l6-2Z" fill="#e03a2f"/>
              <path d="M16.5 26 23 34l-6-2Z" fill="#e03a2f"/>
              <ellipse cx="12" cy="15" rx="3.4" ry="4.2" fill="#5f9bd0"/>
              <path class="rocket-flame" d="M9 32h6l-3 8Z" fill="#ffb046"/>
            </svg>
          </div>
        </div>
      </div>

      <!-- ── The host, in line with the filter row ────────────── -->
      <div class="bar-bottom">
        <div class="host" id="host">
          <div class="bubble" id="bubble"><span id="bubbleText"></span><span class="caret"></span></div>
          <div class="alien" id="alien" aria-hidden="true">
            <svg viewBox="0 0 60 56" width="78" height="73">
              <!-- glass the alien polishes when idle -->
              <g class="glass">
                <path d="M40 22h13l-2.5 9.5a4 4 0 0 1-3.9 3H46.4a4 4 0 0 1-3.9-3Z" fill="rgba(180,215,235,.5)"/>
                <path d="M46.5 34.5v6" stroke="rgba(180,215,235,.6)" stroke-width="2"/>
                <path d="M42 41h9" stroke="rgba(180,215,235,.6)" stroke-width="2" stroke-linecap="round"/>
              </g>
              <g class="cloth"><rect x="36" y="20" width="9" height="7" rx="2" fill="rgba(255,255,255,.28)"/></g>
              <path class="arm" d="M27 34c5 1 8 0 10-3" stroke="#7eb08a" stroke-width="4" stroke-linecap="round" fill="none"/>
              <ellipse cx="20" cy="30" rx="15" ry="18" fill="#7eb08a"/>
              <ellipse class="eye" cx="14" cy="27" rx="3.6" ry="5" fill="#0a1018" transform="rotate(-16 14 27)"/>
              <ellipse class="eye" cx="26" cy="27" rx="3.6" ry="5" fill="#0a1018" transform="rotate(16 26 27)"/>
              <path d="M16 38q4 3 8 0" stroke="#0a1018" stroke-width="1.6" fill="none" stroke-linecap="round"/>
            </svg>
          </div>
        </div>

        <!-- ── Filters ───────────────────────────────────────── -->
        <nav class="filters" id="filters" aria-label="Filter drinks">
          <button class="pill filter is-on" type="button" data-filter="all">All</button>
          <button class="pill filter" type="button" data-filter="strong">Full proof</button>
          <button class="pill filter" type="button" data-filter="weird">Weird</button>
          <button class="pill filter" type="button" data-filter="zero-proof">Sober</button>
        </nav>
      </div>
    </div>

    <!-- ── Recipe ────────────────────────────────────────────── -->
    <div class="sheet" id="sheet" hidden>
      <div class="sheet-scrim" id="sheetScrim"></div>
      <article class="card" role="dialog" aria-modal="true" aria-labelledby="rName">
        <button class="close" id="closeBtn" type="button" aria-label="Close recipe">
          <i class="fa-solid fa-xmark"></i>
        </button>
        <p class="r-star"><span id="rStar"></span> · <span id="rConst"></span></p>
        <h2 class="r-name" id="rName"></h2>
        <p class="r-tagline" id="rTagline"></p>
        <p class="r-fact" id="rFact"></p>
        <dl class="r-meta">
          <div><dt>Based on</dt><dd id="rBased"></dd></div>
          <div><dt>Glass</dt><dd id="rGlass"></dd></div>
        </dl>
        <h3 class="r-h">Ingredients</h3>
        <ul class="r-ing" id="rIng"></ul>
        <h3 class="r-h">Method</h3>
        <p class="r-method" id="rMethod"></p>
        <p class="r-serves">Serves two.</p>
        <p class="r-twin" id="rTwin" hidden></p>
      </article>
    </div>

  </body>
</html>
