<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Star Memory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="star-memory.css" />
    <link rel="stylesheet" href="../../tailwind.css" />
  </head>
  <body>
    <!-- Neptune, Triton and the starfield. `driven`: the game owns the single
         rAF loop and calls tick() on the backdrop each frame. -->
    <st-planet-field id="bg" driven aria-hidden="true"></st-planet-field>
    <canvas id="game" aria-hidden="true"></canvas>

    <!-- Top bar: back link + title badge (left), score + best (right) -->
    <div class="topbar">
      <div class="topbar-group">
        <a href="../../arcade/" class="pill link">← Arcade</a>
        <div class="pill badge">
          <span class="beacon"></span>
          STAR MEMORY
        </div>
      </div>
      <div class="topbar-group">
        <div class="pill stat">SCORE <strong id="score">0</strong></div>
        <a class="pill stat" href="../../scoreboard/"
          >BEST <strong id="best" class="best-val">0</strong></a
        >
      </div>
    </div>

    <!-- Status panel, same shape as ISS Docking's APPROACH panel -->
    <div class="approach" id="status">
      <div class="approach-title">BOARD</div>
      <div class="approach-row">
        <span class="approach-label">PAIRS</span>
        <strong class="approach-value" id="pairsVal">0 / 8</strong>
      </div>
    </div>

    <!-- Intro card, dismissed on first input -->
    <div class="intro-container">
      <div class="intro" id="intro">
        <div class="intro-title">STAR MEMORY</div>
        <div class="intro-body">
          Match the pairs. Saturn has been keeping time for a while and is in no hurry.
        </div>
        <div class="intro-keys" id="introKeys">
          <span><b>Click</b> turn a card</span><span><b>R</b> restart after a match-out</span>
        </div>
        <div class="intro-keys" id="introTouch">
          <span><b>Tap</b> turn a card</span>
        </div>
      </div>
    </div>

    <!-- Game over sign -->
    <div id="gameOver" class="gameover">
      <div class="gameover-card">
        <div id="gameOverTitle" class="gameover-title">CONSTELLATION COMPLETE</div>
        <div class="final-rows">
          <div class="final-row">
            <span>SCORE</span><strong id="finalScore">0</strong>
          </div>
          <div class="final-row final-best">
            <span>BEST</span><strong id="finalBest">0</strong>
            <span class="best-marker" id="bestMarker">NEW</span>
          </div>
        </div>
        <div class="gameover-sub">Press R or Tap</div>
        <button id="gameOverRestart" class="restart-btn" type="button">Play again</button>
      </div>
    </div>

    <script type="module" src="./star-memory.js"></script>
  </body>
</html>
