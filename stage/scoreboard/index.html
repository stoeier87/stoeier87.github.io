  <body>
    <!-- <canvas id="bg" aria-hidden="true"></canvas> -->
    <st-planet-field
      id="bg"
      driven
      ambient-motion="rotate"
      interactive
      satellites="0"
      cursor-motion="translate"
      shooting-stars
      aria-hidden="true"
    ></st-planet-field>
    <div
      id="zodiac-label"
      class="pointer-events-none fixed top-0 left-0 z-10 hidden rounded-full border border-white/20 bg-black/60 px-4 py-2 font-mono text-xs tracking-widest text-white/90 backdrop-blur"
      aria-hidden="true"
    ></div>
    <st-hall-nav
      nav-label="Scoreboard navigation"
      back-href="../arcade/"
      back-label="Back to arcade"
      second-href="../arcade/"
      second-icon="fa-gamepad"
      second-label="Arcade Games"
    ></st-hall-nav>

    <main class="wrap">
      <st-page-header
        icon="fa-ranking-star"
        icon-hidden
        heading="Score"
        accent="board"
        subtitle="Top scores across the solar arcade"
      ></st-page-header>
      <section class="flex flex-col justify-between grow h-max" aria-label="Scoreboard">

        <div id="boards" class="boards"></div>
        <footer>
          <a href="https://servicedesign.dk" target="_blank" rel="noopener"
          >servicedesign.dk</a
          >
        </footer>
      </section>
    </main>
