<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arcade Scoreboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="../css/all.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="../tailwind.css" />
  </head>
  <body>
    <canvas id="bg" aria-hidden="true"></canvas>

    <nav class="board-nav" aria-label="Scoreboard navigation">
      <a class="pill back" href="../arcade/" aria-label="Back to arcade" title="Back to arcade">
        <span class="arrow"><i class="fa-solid fa-arrow-left-long"></i></span>
        <span class="alien" aria-hidden="true">
          <svg viewBox="0 0 26 26" width="17" height="17">
            <ellipse cx="13" cy="15" rx="8.5" ry="10" fill="#7eb08a" />
            <ellipse cx="9.6" cy="13.4" rx="2.1" ry="3" fill="#0a1018"
                     transform="rotate(-18 9.6 13.4)" />
            <ellipse cx="16.4" cy="13.4" rx="2.1" ry="3" fill="#0a1018"
                     transform="rotate(18 16.4 13.4)" />
            <path class="alien-arm" d="M20.5 16.5 L25 11"
                  stroke="#7eb08a" stroke-width="2.3" stroke-linecap="round" fill="none" />
          </svg>
        </span>
      </a>
    </nav>

    <main class="wrap">
      <header>
        <h1><i class="fa-solid fa-ranking-star"></i> Score<span class="red">board</span></h1>
        <p class="sub">Top scores across the solar arcade</p>
      </header>

      <div id="boards" class="boards"></div>
    </main>

    <footer>
      <a href="https://servicedesign.dk" target="_blank" rel="noopener"
        >servicedesign.dk</a
      >
      <script type="module" src="../shared/version-badge.js"></script>
    </footer>

    <script type="module" src="./scoreboard.js"></script>
    <script>
      (() => {
        const c = document.getElementById("bg");
        const x = c.getContext("2d");
        let w = 0,
          h = 0,
          dpr = 1,
          stars = [];
        function rs() {
          dpr = Math.min(devicePixelRatio || 1, 2);
          w = innerWidth;
          h = innerHeight;
          c.width = w * dpr;
          c.height = h * dpr;
          x.setTransform(dpr, 0, 0, dpr, 0, 0);
          stars = [...Array(Math.max(80, Math.round((w * h) / 14000)))].map(
            () => ({
              x: Math.random() * w,
              y: Math.random() * h,
              r: Math.random() * 1.6 + 0.4,
              s: Math.random() * 0.5 + 0.1,
            }),
          );
        }
        addEventListener("resize", rs, { passive: true });
        rs();
        function f(t) {
          x.clearRect(0, 0, w, h);
          for (const s of stars) {
            s.y += s.s;
            if (s.y > h) s.y = -2;
            x.globalAlpha = 0.4 + Math.sin(t * 0.0008 + s.x) * 0.4;
            x.beginPath();
            x.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            x.fillStyle = "#fff";
            x.fill();
          }
          x.globalAlpha = 1;
          requestAnimationFrame(f);
        }
        requestAnimationFrame(f);
      })();
    </script>
  </body>
</html>
