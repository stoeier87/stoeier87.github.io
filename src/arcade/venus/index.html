<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meteor Dodge</title>
    <meta name="st:game-head" />
    <meta name="st:common-head" />
    <link rel="stylesheet" href="meteor-dodge.css" />
    <meta name="st:common-foot" />
  </head>
  <body>
    <canvas id="game" aria-hidden="true"></canvas>

    <!-- Top bar: back link + title badge (left), best score (right). Live
         stats (LVL, HP, RATE/GUNS/DMG/MAG/AURA, SCORE, shield) are drawn as
         plain text inside the canvas play-field border instead. -->
    <st-game-topbar game-title="METEOR DODGE"></st-game-topbar>

    <!-- Auto-pause overlay -->
    <div id="pause" class="gameover">
      <div class="gameover-card">
        <div class="gameover-title">PAUSED</div>
        <button id="resumeBtn" class="restart-btn" type="button">Resume</button>
      </div>
    </div>

    <!-- Upgrade choice: pauses play, offers up to two of the four permanent power-ups -->
    <div id="upgradeChoice" class="gameover">
      <div class="gameover-card upgrade-card">
        <div class="gameover-title">CHOOSE AN UPGRADE</div>
        <div class="upgrade-options">
          <button id="upgradeOptionA" class="upgrade-btn" type="button">
            <span class="upgrade-btn-title" id="upgradeOptionATitle"></span>
            <span class="upgrade-btn-sub" id="upgradeOptionASub"></span>
          </button>
          <button id="upgradeOptionB" class="upgrade-btn" type="button">
            <span class="upgrade-btn-title" id="upgradeOptionBTitle"></span>
            <span class="upgrade-btn-sub" id="upgradeOptionBSub"></span>
          </button>
        </div>
      </div>
    </div>

    <!-- Game over sign -->
    <st-game-over id="gameOver" class="gameover" game-title="BURNED UP"></st-game-over>

    <div class="controls" id="controls">
      <div class="dpad">
        <button id="up" class="dpad-up" aria-label="Move up">▲</button>
        <button id="left" class="dpad-left" aria-label="Move left">◀</button>
        <button id="right" class="dpad-right" aria-label="Move right">▶</button>
        <button id="down" class="dpad-down" aria-label="Move down">▼</button>
      </div>
      <button id="fire" aria-label="Fire laser">⚡</button>
    </div>
    <script type="module" src="meteor-dodge.js"></script>
  </body>
</html>
