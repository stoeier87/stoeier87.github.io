<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>El Barco del Amor</title>
    <!-- Privat underside — samme regler som /gio: noindex her, ingen
         robots.txt-regel, udeladt af sitemap, ingen links hertil udefra.
         Ikke en del af arkaden: intet scoreboard, ingen highscore, ingen
         GAMES-post. -->
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap"
    />
    <link href="../../css/all.min.css" rel="stylesheet" />
    <script type="module" crossorigin src="../../assets/gio/voyage/index-Cgr7KPDI.js"></script>
    <link rel="modulepreload" crossorigin href="../../assets/tailwind-BowG0W28.js">
    <link rel="modulepreload" crossorigin href="../../assets/firebase-config-CE95sHti.js">
    <link rel="modulepreload" crossorigin href="../../assets/gate-qPdJeSUb.js">
    <link rel="stylesheet" crossorigin href="../../assets/tailwind-DzmjQoix.css">
  </head>
  <body class="min-h-screen overflow-hidden bg-bg-deep font-mono text-ink">
    <!-- Kun den runde tilbage-pil — bevidst intet af arkadens kromsprog.
         Resten af interfacet (hjerter, skibe, etapenavne) tegnes i canvas. -->
    <a
      href="../"
      aria-label="Volver a Gio"
      class="fixed top-4 left-4 z-30 flex h-11 w-11 items-center justify-center rounded-pill border-[1.5px] border-border-strong bg-pill-bg text-lg backdrop-blur-[3px] transition-colors hover:border-border-hover focus-visible:outline-2 focus-visible:outline-accent"
      >←</a
    >

    <main class="fixed inset-0" hidden>
      <canvas id="sea" class="h-full w-full touch-none select-none" aria-hidden="true"></canvas>

      <!-- Åbningskortet — forsvinder ved første input -->
      <div id="intro" class="fixed inset-0 z-20 flex items-center justify-center px-6">
        <div
          class="flex max-w-xs flex-col items-center gap-3 rounded-card border border-border bg-card-bg px-8 py-8 text-center backdrop-blur-[3px]"
        >
          <p class="font-display text-xl tracking-wide">EL BARCO DEL AMOR</p>
          <p class="text-xs leading-relaxed text-text-muted">
            Un drakkar vikingo, de Dinamarca a Valparaíso, ida y vuelta. Navega con tu dedo.
          </p>
        </div>
      </div>

      <!-- Auto-pause (fane-skift/blur) — genoptager aldrig af sig selv -->
      <div
        id="paused"
        class="fixed inset-0 z-20 flex items-center justify-center bg-bg-deep/70"
        hidden
      >
        <p class="text-sm tracking-loose text-text-muted lowercase">
          en pausa — toca para continuar
        </p>
      </div>

      <!-- Slutningen: beskeden skrives langsomt her, og bagefter to stille valg.
           Teksten findes IKKE i denne side eller dens bundle — den hentes
           først når rejsen er fuldført (dynamisk import af ending.js). -->
      <div
        id="endingScreen"
        class="fixed inset-0 z-20 flex-col items-center justify-center gap-10 px-8 text-center"
        hidden
      >
        <p
          id="endingText"
          class="max-w-md text-base leading-loose whitespace-pre-line md:text-lg"
        ></p>
        <div id="endingChoices" class="flex items-center gap-4" hidden>
          <button id="sailAgain" type="button" class="pill px-6 text-xs">ZARPAR OTRA VEZ</button>
          <a href="../" class="pill px-6 text-xs">VOLVER</a>
        </div>
        <p id="endingHearts" class="text-xs tracking-loose text-text-dim"></p>
      </div>
    </main>

  </body>
</html>
