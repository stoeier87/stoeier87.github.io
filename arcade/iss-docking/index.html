<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ISS Docking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="/tailwind.css" />
    <link rel="stylesheet" href="iss-docking.css" />
  </head>
  <body>
    <canvas id="game" aria-hidden="true"></canvas>

    <!-- Top bar: back link + title badge (left), score + best (right) -->
    <div class="topbar">
      <div class="topbar-group">
        <a href="/arcade/" class="pill link">← Arcade</a>
        <div class="pill badge">
          <span class="beacon"></span>
          ISS DOCKING
        </div>
      </div>
      <div class="topbar-group">
        <div class="pill stat">SCORE <strong id="score">60</strong></div>
        <a class="pill stat" href="/scoreboard/">BEST <strong id="best" class="best-val">0</strong></a>
      </div>
    </div>

    <!-- Approach telemetry -->
    <div class="approach" id="approach">
      <div class="approach-title">APPROACH</div>
      <div class="approach-row">
        <span class="approach-label">DIST</span>
        <div class="bar"><div class="bar-fill" id="distFill"></div></div>
      </div>
      <div class="approach-row">
        <span class="approach-label">SPEED</span>
        <div class="bar"><div class="bar-fill" id="speedFill"></div></div>
      </div>
      <div class="approach-row">
        <span class="approach-label">ALIGN</span>
        <div class="bar"><div class="bar-fill" id="angleFill"></div></div>
      </div>
    </div>

    <!-- Intro card --> 
    <div class="intro-container">
      <div class="intro" id="intro">
        <div class="intro-title">MATCH &amp; DOCK</div>
        <div class="intro-body">
          Line up with the red port, match the station's
          spin, and drift in slow.
        </div>
      </div>
    </div>

    <!-- Game over sign (restart lives inside it) -->
    <div id="gameOver" class="gameover">
      <div class="gameover-card">
        <div id="gameOverTitle" class="gameover-title">DOCKED</div>
        <div class="gameover-sub">Press R or Tap</div>
        <button id="gameOverRestart" class="restart-btn" type="button">Restart</button>
      </div>
    </div>


    <!-- Invisible N/S/E/W thrust zones (touch devices only; glows injected here) -->
    <div id="touchZones" aria-hidden="true"></div>

    <!-- Touch controls (d-pad fallback; hidden when the touch zones are live) -->
    <div class="controls" id="controls">
      <div class="dpad">
        <button id="up" aria-label="Thrust up">▲</button>
        <div class="dpad-row">
          <button id="left" aria-label="Thrust left">◀</button>
          <button id="down" aria-label="Thrust down">▼</button>
          <button id="right" aria-label="Thrust right">▶</button>
        </div>
      </div>
    </div>

    <script type="module" src="iss-docking.js"></script>
  </body>
</html>
