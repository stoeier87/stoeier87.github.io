<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GALILEO</title>
    <meta name="st:game-head" />
    <meta name="st:common-head" />
    <link rel="stylesheet" href="galileo.css" />
    <meta name="st:common-foot" />
  </head>
  <body>
    <!-- Jupiter and the starfield. `driven`: galileo.js owns the single
         rAF loop and ticks the backdrop each frame. -->
    <st-planet-field id="bg" driven aria-hidden="true"></st-planet-field>
    <canvas id="game" aria-hidden="true"></canvas>

    <!-- Canonical chrome: circular back arrow + title pill top left,
         SCORE and BEST top right, status panel bottom left. -->
    <st-game-topbar game-title="GALILEO"></st-game-topbar>

    <!-- Status panel, same shape as ISS Docking's APPROACH panel -->
    <div class="approach" id="status">
      <div class="approach-title">SURVEY</div>
      <div class="approach-row">
        <span class="approach-label">BOARD</span>
        <strong class="approach-value" id="boardVal">1</strong>
      </div>
      <div class="approach-row">
        <span class="approach-label">POCKETS</span>
        <strong class="approach-value" id="pocketsVal">10</strong>
      </div>
      <div class="approach-row">
        <span class="approach-label">RADIATION</span>
        <div class="bar"><div class="bar-fill" id="radFill"></div></div>
      </div>
      <div class="approach-row">
        <span class="approach-label">TIME</span>
        <strong class="approach-value" id="timeVal">120</strong>
      </div>
    </div>

    <!-- Briefing card, dismissed on first input -->
    <st-game-intro game-key="jupiter"></st-game-intro>

    <!-- Auto-pause overlay: appears on tab switch or window blur, and the
         run resumes only when asked to. -->
    <div id="pause" class="gameover">
      <div class="gameover-card">
        <div class="gameover-title">PAUSED</div>
        <div class="pause-sub">The survey holds position</div>
        <button id="resumeBtn" class="restart-btn" type="button">Resume</button>
      </div>
    </div>

    <!-- Game over sign -->
    <st-game-over id="gameOver" class="gameover" game-title="PROBE LOST" restart-label="Play again">
      <div class="final-rows">
          <div class="final-row"><span>SCORE</span><strong id="finalScore">0</strong></div>
          <div class="final-row"><span>BOARDS</span><strong id="finalBoards">0</strong></div>
          <div class="final-row final-best">
            <span>BEST</span><strong id="finalBest">0</strong>
            <span class="best-marker" id="bestMarker">NEW</span>
          </div>
        </div>
    </st-game-over>

    <script type="module" src="./galileo.js"></script>
  </body>
</html>
