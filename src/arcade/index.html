<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arcade — stoeier.dk</title>
    <meta name="description" content="Solar System Arcade on stoeier.dk" />
    <meta name="st:common-head" />
    <link rel="stylesheet" href="./arcade.css" />
    <meta name="st:common-foot" />
  </head>
  <body>
    <!-- `driven`: arcade.js owns the single rAF loop and calls tick() on the
         backdrop each frame. No drift (auto-scroll rate) and no travel pan on
         card hover (see arcade.js) -- cursor-motion="pan" is the motion: a
         continuous sweep across the whole planet field, driven by pointer x.
         Left edge centres the rightmost planet, right edge centres the
         leftmost, dead centre is this layout's own rest state, unchanged --
         see planet-field.ts's cursorMotion doc. ADR-025's homepage sky uses
         "rotate" instead, a much smaller ambient tilt. -->
    <st-planet-field id="bg" driven cursor-motion="pan" aria-hidden="true"></st-planet-field>
    <st-hall-nav
      nav-label="Arcade navigation"
      back-href="../"
      back-label="Back to homepage"
      second-href="../scoreboard/"
      second-icon="fa-ranking-star"
      second-label="View scoreboard"
    ></st-hall-nav>
    <main class="wrap">
      <st-page-header
        heading="ARCADE"
        accent="GAMES"
        subtitle="Pick a planet. Start your mission. Only real pilots make the scoreboard."
      ></st-page-header>
      <section class="flex flex-col justify-between grow h-max" aria-label="Arcade games">
            <section class="solar-system" id="solarSystem"></section>
            <!-- The full contact footer (<st-footer>) is homepage-only by
                 decision — everywhere else the mark stays quiet. -->
            <footer>
              <a href="https://servicedesign.dk" target="_blank" rel="noopener"
                >servicedesign.dk</a
              >
              <script type="module" src="../shared/version-badge.js"></script>
          </footer>
      </section>
    </section>
    </main>

    <script type="module" src="./arcade.js"></script>
  </body>
</html>
