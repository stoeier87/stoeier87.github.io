  <body>
    <canvas id="game"></canvas>

    <!-- Canonical chrome: circular back arrow + title pill top left,
         SCORE and BEST top right. -->
    <st-game-topbar game-title="ORBIT RUNNER"></st-game-topbar>

    <!-- Intro card, dismissed on first input -->
    <st-game-intro game-key="mercury"></st-game-intro>

    <!-- Auto-pause overlay -->
    <div id="pause" class="gameover">
      <div class="gameover-card">
        <div class="gameover-title">PAUSED</div>
        <button id="resumeBtn" class="restart-btn" type="button">Resume</button>
      </div>
    </div>

    <!-- Game over sign: the shared .gameover overlay every other game uses,
         replacing what used to be canvas-drawn "MISSION FAILED" text. -->
    <st-game-over id="gameOver" class="gameover" game-title="MISSION FAILED">
      <div class="final-rows">
          <div class="final-row"><span>SCORE</span><strong id="finalScore">0</strong></div>
          <div class="final-row final-best">
            <span>BEST</span><strong id="finalBest">0</strong>
            <span class="best-marker" id="bestMarker">NEW</span>
          </div>
        </div>
    </st-game-over>

  </body>
