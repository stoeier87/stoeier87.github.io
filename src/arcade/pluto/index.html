<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ice Fall</title>
    <meta name="st:game-head" />
    <meta name="st:common-head" />
    <link rel="stylesheet" href="ice-fall.css" />
    <meta name="st:common-foot" />
  </head>
  <body>
    <!-- Pluto, Charon, the sun and the starfield. `driven`: ice-fall.js owns
         the single rAF loop and calls tick() on the backdrop each frame. -->
    <st-planet-field id="bg" driven aria-hidden="true"></st-planet-field>
    <canvas id="game" aria-hidden="true"></canvas>

    <!-- Top bar: back link + title badge (left), score + best (right) -->
    <st-game-topbar game-title="ICE FALL"></st-game-topbar>

    <!-- Next queue, under the score pills -->
    <div class="slot slot-next" id="nextSlot">
      <div class="slot-label">NEXT</div>
      <canvas id="nextCanvas" aria-hidden="true"></canvas>
    </div>

    <!-- Status panel, same shape as ISS Docking's APPROACH panel -->
    <div class="approach" id="status">
      <div class="approach-title">STATUS</div>
      <div class="approach-row">
        <span class="approach-label">LEVEL</span>
        <strong class="approach-value" id="levelVal">1</strong>
      </div>
      <div class="approach-row">
        <span class="approach-label">LINES</span>
        <strong class="approach-value" id="linesVal">0</strong>
      </div>
      <div class="approach-row">
        <span class="approach-label">PRESSURE</span>
        <div class="bar"><div class="bar-fill" id="pressureFill"></div></div>
      </div>
    </div>

    <!-- Intro card, dismissed on first input -->
    <st-game-intro game-key="pluto"></st-game-intro>

    <!-- Pause overlay -->
    <div id="pause" class="gameover">
      <div class="gameover-card">
        <div class="gameover-title">PAUSED</div>
        <div class="pause-sub">Press P to resume</div>
        <button id="resumeBtn" class="restart-btn" type="button">Resume</button>
      </div>
    </div>

    <!-- Game over sign -->
    <st-game-over id="gameOver" class="gameover" game-title="ICE FALL" restart-label="Play again">
      <div class="final-rows">
          <div class="final-row">
            <span>SCORE</span><strong id="finalScore">0</strong>
          </div>
          <div class="final-row"><span>LINES</span><strong id="finalLines">0</strong></div>
          <div class="final-row"><span>LEVEL</span><strong id="finalLevel">1</strong></div>
          <div class="final-row final-best">
            <span>BEST</span><strong id="finalBest">0</strong>
            <span class="best-marker" id="bestMarker">NEW</span>
          </div>
        </div>
    </st-game-over>

    <script type="module" src="./ice-fall.js"></script>
  </body>
</html>
