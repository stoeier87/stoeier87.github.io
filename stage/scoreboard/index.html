<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arcade Scoreboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap"
    />
    <link href="../css/all.min.css" rel="stylesheet" />
    <script type="module" crossorigin src="../assets/scoreboard/index-Dz4_sRJk.js"></script>
    <link rel="modulepreload" crossorigin href="../assets/tailwind-CX4d6OwZ.js">
    <link rel="modulepreload" crossorigin href="../assets/planet-textures-DAkK65wv.js">
    <link rel="modulepreload" crossorigin href="../assets/planet-field-DSfPo_0H.js">
    <link rel="modulepreload" crossorigin href="../assets/page-header-BXTlxPh2.js">
    <link rel="modulepreload" crossorigin href="../assets/hall-nav-BSiOhpg2.js">
    <link rel="modulepreload" crossorigin href="../assets/firebase-config-CE95sHti.js">
    <link rel="modulepreload" crossorigin href="../assets/games-data-CZaWL4_h.js">
    <link rel="modulepreload" crossorigin href="../assets/zodiac-periods-BYYFId7n.js">
    <link rel="stylesheet" crossorigin href="../assets/tailwind-DIQ9uPrw.css">
    <link rel="stylesheet" crossorigin href="../assets/index-s_C5FJak.css">
  </head>
  <body>
    <!-- <canvas id="bg" aria-hidden="true"></canvas> -->
    <st-planet-field
      id="bg"
      driven
      ambient-motion="rotate"
      interactive
      satellites="0"
      cursor-motion="translate"
      shooting-stars
      aria-hidden="true"
    ></st-planet-field>
    <st-hall-nav
      nav-label="Scoreboard navigation"
      back-href="../arcade/"
      back-label="Back to arcade"
      second-href="./hall-of-stars/"
      second-icon="fa-star"
      second-label="Hall of Stars"
    ></st-hall-nav>

    <main class="wrap">
      <st-page-header
        icon="fa-ranking-star"
        icon-hidden
        heading="Score"
        accent="board"
        subtitle="Top scores across the solar arcade"
      ></st-page-header>
      <!-- The running zodiac period — recomputed at load and on
           visibilitychange in scoreboard.js, e.g. "Leo, until 22 August". -->
      <p id="period-line" class="mb-6 text-center text-xs tracking-[0.22em] text-white/35" aria-live="polite"></p>
      <section class="flex flex-col justify-between grow h-max" aria-label="Scoreboard">

        <div id="boards" class="boards"></div>
        <!-- Deliberately NOT <st-footer>: the scoreboard footer reads only
             SERVICEDESIGN.DK, dimmed — no contact pills, no version badge
             (task-1 decision, this branch). The element stays in use on the
             pages that want the full footer. -->
        <footer>
          <a href="https://servicedesign.dk" target="_blank" rel="noopener"
          >servicedesign.dk</a
          >
        </footer>
      </section>
    </main>


  </body>
</html>
