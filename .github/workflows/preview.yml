name: Deploy Branch Preview

on:
  push:
    branches:
      - "feature/**"
      - "stage/**"
      - "preview/**"

concurrency:
  group: gh-pages-write
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist

      # See the matching step in stage.yml -- peaceiris/actions-gh-pages
      # never records a Deployment against the source branch itself.
      - name: Record deployment
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: `preview/${context.ref.replace("refs/heads/", "")}`,
              auto_merge: false,
              required_contexts: [],
              production_environment: false,
              transient_environment: true,
            });
            core.setOutput("id", deployment.data.id);

      - name: Deploy preview
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          destination_dir: preview/${{ github.ref_name }}
          keep_files: true
          commit_message: "Deploy preview for ${{ github.ref_name }}: ${{ github.sha }}"

      - name: Mark deployment success
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.id }},
              state: "success",
              environment_url: "https://stoeier87.github.io/preview/${{ github.ref_name }}/",
              description: "Deployed preview",
            });

      - name: Summary
        run: |
          echo "### Preview deployed :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "https://stoeier87.github.io/preview/${{ github.ref_name }}/" >> "$GITHUB_STEP_SUMMARY"
