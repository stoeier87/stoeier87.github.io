<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Star Memory</title>
    <meta name="st:game-head" />
    <meta name="st:common-head" />
    <link rel="stylesheet" href="star-memory.css" />
    <meta name="st:common-foot" />
  </head>
  <body>
    <!-- Neptune, Triton and the starfield. `driven`: the game owns the single
         rAF loop and calls tick() on the backdrop each frame. -->
    <st-planet-field id="bg" driven aria-hidden="true"></st-planet-field>
    <canvas id="game" aria-hidden="true"></canvas>

    <!-- Top bar: back link + title badge (left), score + best (right) -->
    <st-game-topbar game-title="STAR MEMORY"></st-game-topbar>

    <!-- Status panel, same shape as ISS Docking's APPROACH panel -->
    <div class="approach" id="status">
      <div class="approach-title">RUN</div>
      <div class="approach-row">
        <span class="approach-label">ROUND</span>
        <strong class="approach-value" id="roundVal">1</strong>
      </div>
      <div class="approach-row">
        <span class="approach-label">PAIRS</span>
        <strong class="approach-value" id="pairsVal">0 / 6</strong>
      </div>
      <div class="approach-row">
        <span class="approach-label">MULTI</span>
        <strong class="approach-value" id="multVal">x1</strong>
      </div>
      <div class="approach-row">
        <span class="approach-label">TIME</span>
        <div class="bar"><div class="bar-fill" id="timeFill"></div></div>
      </div>
    </div>

    <!-- Auto-pause overlay -->
    <div id="pause" class="gameover">
      <div class="gameover-card">
        <div class="gameover-title">PAUSED</div>
        <button id="resumeBtn" class="restart-btn" type="button">Resume</button>
      </div>
    </div>

    <!-- Intro card, dismissed on first input -->
    <div class="intro-container">
      <div class="intro" id="intro">
        <div class="intro-title">STAR MEMORY</div>
        <div class="intro-body">
          Match the constellations before the clock runs down. Saturn has been keeping time for a
          while; now it is your turn.
        </div>
        <div class="intro-keys" id="introKeys">
          <span><b>Click</b> turn a card</span><span><b>R</b> restart when time is out</span>
        </div>
        <div class="intro-keys" id="introTouch">
          <span><b>Tap</b> turn a card</span>
        </div>
      </div>
    </div>

    <!-- Game over sign -->
    <st-game-over id="gameOver" class="gameover" game-title="CONSTELLATION COMPLETE" restart-label="Play again">
      <div class="final-rows">
          <div class="final-row">
            <span>SCORE</span><strong id="finalScore">0</strong>
          </div>
          <div class="final-row">
            <span>ROUNDS</span><strong id="finalRounds">0</strong>
          </div>
          <div class="final-row final-best">
            <span>BEST</span><strong id="finalBest">0</strong>
            <span class="best-marker" id="bestMarker">NEW</span>
          </div>
        </div>
    </st-game-over>

    <script type="module" src="./star-memory.js"></script>
  </body>
</html>
