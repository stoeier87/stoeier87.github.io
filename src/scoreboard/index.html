<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arcade Scoreboard</title>
    <meta name="st:common-head" />
    <link rel="stylesheet" href="./scoreboard.css" />
    <meta name="st:common-foot" />
  </head>
  <body>
    <!-- <canvas id="bg" aria-hidden="true"></canvas> -->
    <st-planet-field
      id="bg"
      driven
      ambient-motion="rotate"
      interactive
      satellites="0"
      cursor-motion="translate"
      shooting-stars
      aria-hidden="true"
    ></st-planet-field>
    <st-hall-nav
      nav-label="Scoreboard navigation"
      back-href="../arcade/"
      back-label="Back to arcade"
      second-href="./hall-of-stars/"
      second-icon="fa-star"
      second-label="Hall of Stars"
    ></st-hall-nav>

    <main class="wrap">
      <st-page-header
        icon="fa-ranking-star"
        icon-hidden
        heading="Score"
        accent="board"
        subtitle="Top scores across the solar arcade"
      ></st-page-header>
      <!-- The running zodiac period — recomputed at load and on
           visibilitychange in scoreboard.js, e.g. "Leo, until 22 August". -->
      <p id="period-line" class="mb-6 text-center text-xs tracking-[0.22em] text-white/35" aria-live="polite"></p>
      <section class="flex flex-col justify-between grow h-max" aria-label="Scoreboard">

        <div id="boards" class="boards"></div>
        <footer>
          <a href="https://servicedesign.dk" target="_blank" rel="noopener"
          >servicedesign.dk</a
          >
        </footer>
      </section>
    </main>


    <script type="module" src="./scoreboard.js"></script>
  </body>
</html>
