name: Guard PR Source Branch

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, edited]

jobs:
  require-stage-source:
    runs-on: ubuntu-latest
    steps:
      - name: PRs into main must come from stage
        run: |
          if [ "${{ github.head_ref }}" != "stage" ]; then
            echo "::error::PRs into main must come from the stage branch. This PR is from '${{ github.head_ref }}'."
            exit 1
          fi
          echo "OK: PR source is stage"
