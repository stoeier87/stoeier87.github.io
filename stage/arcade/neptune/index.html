  <body>
    <!-- Neptune, Triton and the starfield. `driven`: the game owns the single
         rAF loop and calls tick() on the backdrop each frame. -->
    <st-planet-field id="bg" driven aria-hidden="true"></st-planet-field>
    <canvas id="game" aria-hidden="true"></canvas>

    <!-- Top bar: back link + title badge (left), score + best (right) -->
    <st-game-topbar game-title="DIAMOND RAIN"></st-game-topbar>

    <!-- Status panel, same shape as ISS Docking's APPROACH panel -->
    <div class="approach" id="status">
      <div class="approach-title">SURVEY</div>
      <div class="approach-row">
        <span class="approach-label">DEPTH</span>
        <strong class="approach-value" id="depthVal">1</strong>
      </div>
      <div class="approach-row">
        <span class="approach-label">SHARDS</span>
        <strong class="approach-value" id="shardsVal">1</strong>
      </div>
      <div class="approach-row">
        <span class="approach-label">DESCENT</span>
        <div class="bar"><div class="bar-fill" id="descentFill"></div></div>
      </div>
      <div class="approach-row">
        <span class="approach-label">LIVES</span>
        <strong class="approach-value" id="livesVal">3</strong>
      </div>
    </div>

    <!-- Intro card, dismissed on first input -->
    <st-game-intro game-key="neptune"></st-game-intro>

    <!-- Pause overlay -->
    <div id="pause" class="gameover">
      <div class="gameover-card">
        <div class="gameover-title">PAUSED</div>
        <div class="pause-sub">Press P to resume</div>
        <button id="resumeBtn" class="restart-btn" type="button">Resume</button>
      </div>
    </div>

    <!-- Game over sign -->
    <st-game-over id="gameOver" class="gameover" game-title="DIAMOND RAIN" restart-label="Play again">
      <div class="final-rows">
          <div class="final-row">
            <span>SCORE</span><strong id="finalScore">0</strong>
          </div>
          <div class="final-row"><span>DEPTH</span><strong id="finalDepth">1</strong></div>
          <div class="final-row final-best">
            <span>BEST</span><strong id="finalBest">0</strong>
            <span class="best-marker" id="bestMarker">NEW</span>
          </div>
        </div>
    </st-game-over>

  </body>
</html>
