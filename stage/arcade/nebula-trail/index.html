<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nebula Trail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script type="module" crossorigin src="../../assets/arcade/nebula-trail/index-DUr8xEgY.js"></script>
    <link rel="modulepreload" crossorigin href="../../assets/tailwind-BwqfsUub.js">
    <link rel="modulepreload" crossorigin href="../../assets/starfield-BR1LaLa8.js">
    <link rel="modulepreload" crossorigin href="../../assets/firebase-config-CLc0baU0.js">
    <link rel="modulepreload" crossorigin href="../../assets/score-submit-C2yMQjp8.js">
    <link rel="stylesheet" crossorigin href="../../assets/tailwind-BeRJgK_l.css">
    <link rel="stylesheet" crossorigin href="../../assets/index-p5IT3Bqp.css">
  </head>
  <body>
    <canvas id="game" aria-hidden="true"></canvas>

    <!-- Top bar: back link + title badge (left), score + best (right) -->
    <div class="topbar">
      <div class="topbar-group">
        <a href="../../arcade/" class="pill link">← Arcade</a>
        <div class="pill badge">
          <span class="beacon"></span>
          NEBULA TRAIL
        </div>
      </div>
      <div class="topbar-group">
        <div class="pill stat">SCORE <strong id="score">0</strong></div>
        <a class="pill stat" href="../../scoreboard/">BEST <strong id="best" class="best-val">0</strong></a>
      </div>
    </div>

    <!-- Intro card -->
    <div class="intro-container">
      <div class="intro" id="intro">
        <div class="intro-title">NEBULA TRAIL</div>
        <div class="intro-body">
          Eat pellets to grow — the
          bigger the trail, the bigger the pellets. Grab the rare comet
          before it fades!
        </div>
      </div>
    </div>

    <!-- Game over sign -->
    <div id="gameOver" class="gameover">
      <div class="gameover-card">
        <div id="gameOverTitle" class="gameover-title">TRAIL FADED</div>
        <div class="gameover-sub">Press R or Tap</div>
        <button id="gameOverRestart" class="restart-btn" type="button">Restart</button>
      </div>
    </div>

    <!-- Touch controls -->
    <div class="controls" id="controls">
      <div class="dpad">
        <div class="dpad-row">
          <button id="rotateLeft" aria-label="Rotate left">↺</button>
          <button id="up" aria-label="Turn up">▲</button>
          <button id="rotateRight" aria-label="Rotate right">↻</button>
        </div>
        <div class="dpad-row">
          <button id="left" aria-label="Turn left">◀</button>
          <button id="down" aria-label="Turn down">▼</button>
          <button id="right" aria-label="Turn right">▶</button>
        </div>
      </div>
    </div>

    <!-- Hidden numpad input: focus it on mobile, then 1=left 9=right -->
    <input id="numInput" type="number" inputmode="numeric"
      style="position:fixed;bottom:0;left:50%;transform:translateX(-50%);
             width:1px;height:1px;opacity:0;pointer-events:none;border:none;"
      autocomplete="off" aria-hidden="true" tabindex="-1">
  </body>
</html>
