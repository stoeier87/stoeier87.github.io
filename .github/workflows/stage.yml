name: Deploy Stage

# Rung 2 of the ladder in envs.json. ONE persistent URL that always holds the
# latest release candidate: https://stoeier87.github.io/stage/
#
# This is a single branch named `stage`, not the legacy `stage/**` pattern that
# preview.yml still matches and publishes per-branch. That pattern is what made
# "staging" mean eight different URLs. See DECISIONS.md ADR-006.
#
# The gates are what distinguish this rung from preview: preview only has to
# build, stage has to be clean. That asymmetry is the prototyping balance
# (ADR-007) — don't add gates to preview, and don't remove them from here.

on:
  push:
    branches:
      - stage
  workflow_dispatch:

# Mandatory. One gh-pages branch, many destination dirs, keep_files: true,
# never cancel a write.
concurrency:
  group: gh-pages-write
  cancel-in-progress: false

jobs:
  # Computes and, if needed, commits the next package.json version -- see
  # docs/CLAUDE.md's Versioning section for the full rule set. Fires on
  # every push to stage (direct push, cherry-pick, or a merged PR into
  # stage are all just push events here), but only ever pushes a new
  # commit when the computed target actually differs from what's already
  # committed -- so a chatty release cycle with five pushes doesn't
  # produce five bumps. The commit's own push does re-trigger this
  # workflow, but that second run is a harmless no-op: LAST_TAG hasn't
  # moved (tagging happens on merge to main, not here), so NEXT recomputes
  # to the same value already sitting in package.json and the `if [ "$NEXT"
  # != "$CURRENT" ]` guard below skips the commit. No job-level `if` guard
  # needed -- and there must not be one, because a job-level skip cascades
  # to every `needs: bump` job after it, leaving the release commit with
  # zero check runs. That commit is exactly what ends up as a PR's head
  # SHA, so a skipped run there means the PR can never satisfy required
  # checks. Same reason the commit itself carries no `[skip ci]`.
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.finalize.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage
          fetch-depth: 0

      - name: Compute and apply version bump
        id: finalize
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$LAST_TAG" ]; then
            LAST_TAG="v$(node -p "require('./package.json').version")"
          fi

          if git rev-parse "$LAST_TAG" >/dev/null 2>&1; then
            LOG=$(git log "${LAST_TAG}..HEAD" --pretty=%s%n%b)
          else
            LOG=$(git log --pretty=%s%n%b)
          fi

          BUMP=patch
          if echo "$LOG" | grep -qE "BREAKING CHANGE:|^[a-zA-Z]+(\([^)]*\))?!:"; then
            BUMP=major
          elif echo "$LOG" | grep -qE "^feat(\([^)]*\))?:"; then
            BUMP=minor
          fi

          BASE="${LAST_TAG#v}"
          NEXT=$(node -e "
            const [maj, min, pat] = '$BASE'.split('.').map(Number);
            const bump = '$BUMP';
            const v = bump === 'major' ? [maj + 1, 0, 0] : bump === 'minor' ? [maj, min + 1, 0] : [maj, min, pat + 1];
            console.log(v.join('.'));
          ")

          CURRENT=$(node -p "require('./package.json').version")
          if [ "$NEXT" != "$CURRENT" ]; then
            node -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              pkg.version = '$NEXT';
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            "
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package.json
            git commit -m "chore(release): v$NEXT"
            git push origin HEAD:stage
            echo "Bumped $CURRENT -> $NEXT ($BUMP)"
          else
            echo "Already at $CURRENT for this release cycle, nothing to commit."
          fi

          echo "version=$NEXT" >> "$GITHUB_OUTPUT"

  gates:
    needs: bump
    name: Gates (format, lint, typecheck, tokens)
    runs-on: ubuntu-latest
    steps:
      # ref: stage, not the default trigger SHA -- picks up the bump
      # job's commit when it made one, instead of building the stale
      # pre-bump snapshot.
      - uses: actions/checkout@v4
        with:
          ref: stage

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # `npm install`, not `npm ci` — package-lock.json is gitignored, matching
      # build.yml. Known issue 5.
      - name: Install
        run: npm install

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tokens match tailwind.css
        run: npm run tokens

  build:
    needs: gates
    uses: ./.github/workflows/build.yml
    with:
      ref: stage

  deploy:
    needs: [bump, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist

      # peaceiris/actions-gh-pages pushes straight to gh-pages, which never
      # records a Deployment against the `stage` branch itself -- so a PR
      # with `stage` as its head shows "This branch has not been deployed".
      # This is purely an additional record for that widget; it changes
      # nothing about how the site actually publishes.
      - name: Record deployment
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: "stage",
              auto_merge: false,
              required_contexts: [],
              production_environment: false,
            });
            core.setOutput("id", deployment.data.id);

      - name: Deploy stage
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          destination_dir: stage
          keep_files: true
          commit_message: "Deploy stage: ${{ github.sha }}"

      - name: Mark deployment success
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.id }},
              state: "success",
              environment_url: "https://stoeier87.github.io/stage/",
              description: "Deployed to stage",
            });

      - name: Summary
        run: |
          echo "### Stage deployed :satellite: v${{ needs.bump.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "https://stoeier87.github.io/stage/" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This is the single persistent release candidate — it replaced whatever was there." >> "$GITHUB_STEP_SUMMARY"
