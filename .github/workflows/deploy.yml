name: Deploy GitHub Pages

on:
  pull_request:
    branches: ["main"]
    types: [ synchronize, reopened, closed, opened ]
  workflow_dispatch:

concurrency:
  group: gh-pages-write
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist

      # See the matching step in stage.yml -- peaceiris/actions-gh-pages
      # never records a Deployment against the branch/PR that triggered it.
      - name: Record deployment
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: "${{ github.event.pull_request.merge_commit_sha || github.sha }}",
              environment: "production",
              auto_merge: false,
              required_contexts: [],
              production_environment: true,
            });
            core.setOutput("id", deployment.data.id);

      - name: Deploy to GitHub Pages (production)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          destination_dir: .
          keep_files: true
          commit_message: "Deploy production: ${{ github.event.pull_request.merge_commit_sha || github.sha }}"

      - name: Mark deployment success
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.id }},
              state: "success",
              environment_url: "https://stoeier.dk/",
              description: "Deployed to production",
            });
