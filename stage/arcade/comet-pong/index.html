<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FLYBY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script type="module" crossorigin src="../../assets/arcade/comet-pong/index-BkmmOEOH.js"></script>
    <link rel="modulepreload" crossorigin href="../../assets/tailwind-vN0XEIAB.js">
    <link rel="modulepreload" crossorigin href="../../assets/tokens-DZhOMBh-.js">
    <link rel="modulepreload" crossorigin href="../../assets/firebase-config-CLc0baU0.js">
    <link rel="modulepreload" crossorigin href="../../assets/score-submit-Bewzh5NB.js">
    <link rel="stylesheet" crossorigin href="../../assets/tailwind-CcSOQN3m.css">
    <link rel="stylesheet" crossorigin href="../../assets/index-CWZcEWfo.css">
  </head>
  <body>
    <!-- Jupiter and the starfield. `driven`: flyby.js owns the single rAF
         loop and calls tick() on the backdrop each frame. -->
    <st-planet-field id="bg" driven aria-hidden="true"></st-planet-field>
    <canvas id="game" aria-hidden="true"></canvas>

    <!-- Top bar, the ISS Docking treatment: back control + title pill with
         the accent dot (left), score + best (right). The back control is
         the site's circular back arrow — a circle, an arrow, no text. -->
    <div class="topbar">
      <div class="topbar-group">
        <a href="../../arcade/" class="pill back-circle" aria-label="Back to arcade" title="Back to arcade">←</a>
        <div class="pill badge">
          <span class="beacon"></span>
          FLYBY
        </div>
      </div>
      <div class="topbar-group">
        <div class="pill stat">SCORE <strong id="score">0</strong></div>
        <a class="pill stat" href="../../scoreboard/"
          >BEST <strong id="best" class="best-val">0</strong></a
        >
      </div>
    </div>

    <!-- Status panel, same shape as ISS Docking's APPROACH panel -->
    <div class="approach" id="status">
      <div class="approach-title">MISSION</div>
      <div class="approach-row">
        <span class="approach-label">RING</span>
        <strong class="approach-value" id="ringVal">1</strong>
      </div>
      <div class="approach-row">
        <span class="approach-label">PROBES</span>
        <strong class="approach-value" id="probesVal">3</strong>
      </div>
      <div class="approach-row">
        <span class="approach-label">SHIELD</span>
        <div class="bar"><div class="bar-fill" id="shieldFill"></div></div>
      </div>
      <div class="approach-row">
        <span class="approach-label">MULTI</span>
        <strong class="approach-value" id="multVal">x1</strong>
      </div>
    </div>

    <!-- Briefing card, dismissed on first input -->
    <div class="intro-container">
      <div class="intro" id="intro">
        <div class="intro-title">FLYBY</div>
        <div class="intro-body">Jupiter pulls harder than you think. Use it.</div>
        <div class="intro-keys" id="introKeys">
          <span><b>Drag</b> aim &amp; power</span><span><b>Release</b> launch</span
          ><span><b>R</b> reset aim</span><span><b>P / Esc</b> pause</span>
        </div>
        <div class="intro-keys" id="introTouch">
          <span><b>Drag anywhere</b> aim</span><span><b>Release</b> launch</span>
        </div>
      </div>
    </div>

    <!-- Pause overlay -->
    <div id="pause" class="gameover">
      <div class="gameover-card">
        <div class="gameover-title">PAUSED</div>
        <div class="pause-sub">Press P to resume</div>
        <button id="resumeBtn" class="restart-btn" type="button">Resume</button>
      </div>
    </div>

    <!-- Game over sign -->
    <div id="gameOver" class="gameover">
      <div class="gameover-card">
        <div id="gameOverTitle" class="gameover-title">OUT OF PROBES</div>
        <div class="final-rows">
          <div class="final-row"><span>SCORE</span><strong id="finalScore">0</strong></div>
          <div class="final-row"><span>RINGS</span><strong id="finalRings">0</strong></div>
          <div class="final-row final-best">
            <span>BEST</span><strong id="finalBest">0</strong>
            <span class="best-marker" id="bestMarker">NEW</span>
          </div>
        </div>
        <div class="gameover-sub">Press R or Tap</div>
        <button id="gameOverRestart" class="restart-btn" type="button">Play again</button>
      </div>
    </div>

  </body>
</html>
