<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Selected Tools — Tobias Fullerton Støier</title>
    <meta
      name="description"
      content="Service design and strategy tools I actually use, one geometric model at a time."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="./tools.css" />
    <link href="../css/all.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../tailwind.css" />
  </head>
  <body>
    <canvas id="backdrop" aria-hidden="true"></canvas>

    <nav class="tools-nav" aria-label="Tools navigation">
      <a class="pill back" href="../" aria-label="Back to homepage" title="Back to homepage">
        <span class="arrow"><i class="fa-solid fa-arrow-left-long"></i></span>
        <span class="alien" aria-hidden="true">
          <svg viewBox="0 0 26 26" width="17" height="17">
            <ellipse cx="13" cy="15" rx="8.5" ry="10" fill="#7eb08a" />
            <ellipse cx="9.6" cy="13.4" rx="2.1" ry="3" fill="#0a1018"
                     transform="rotate(-18 9.6 13.4)" />
            <ellipse cx="16.4" cy="13.4" rx="2.1" ry="3" fill="#0a1018"
                     transform="rotate(18 16.4 13.4)" />
            <path class="alien-arm" d="M20.5 16.5 L25 11"
                  stroke="#7eb08a" stroke-width="2.3" stroke-linecap="round" fill="none" />
          </svg>
        </span>
      </a>
      <a class="pill" href="./validator/">
        <span class="arrow"><i class="fa-solid fa-list-check"></i></span>
        Idea Validator
      </a>
    </nav>

    <svg class="satellite" viewBox="0 0 40 18" aria-hidden="true" focusable="false">
      <rect class="body" x="14" y="6" width="12" height="6" />
      <rect class="body" x="2" y="5" width="10" height="8" />
      <rect class="body" x="28" y="5" width="10" height="8" />
      <line class="body" x1="14" y1="9" x2="12" y2="9" />
      <line class="body" x1="26" y1="9" x2="28" y2="9" />
    </svg>

    <!-- The grid the models sit on. Normal page flow — scrolls if the
         grid needs more room than the viewport. -->
    <div class="space" id="space"></div>

    <script type="module" src="./tools.js"></script>
  </body>
</html>
