<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phobos Lander</title>
    <meta name="st:game-head" />
    <meta name="st:common-head" />
    <link rel="stylesheet" href="phobos-lander.css" />
    <meta name="st:common-foot" />
  </head>
  <body>
    <canvas id="game" aria-hidden="true"></canvas>

    <!-- Top bar: back link + title badge (left), score + best (right) -->
    <st-game-topbar game-title="PHOBOS LANDER"></st-game-topbar>

    <!-- Status panel, same shape as ISS Docking's APPROACH panel -->
    <div class="approach" id="status">
      <div class="approach-title">LANDER</div>
      <div class="approach-row">
        <span class="approach-label">FUEL</span>
        <strong class="approach-value"><span id="fuel">100</span>%</strong>
      </div>
    </div>

    <!-- Auto-pause overlay -->
    <div id="pause" class="gameover">
      <div class="gameover-card">
        <div class="gameover-title">PAUSED</div>
        <button id="resumeBtn" class="restart-btn" type="button">Resume</button>
      </div>
    </div>

    <!-- Intro card -->
    <div class="intro-container">
      <div class="intro" id="intro">
        <div class="intro-title">PHOBOS LANDER</div>
        <div class="intro-body">
          Space / W to thrust. A / D or ← / → to rotate. Land gently on a pad to score.
        </div>
      </div>
    </div>

    <!-- Game over sign -->
    <st-game-over id="gameOver" class="gameover" game-title="TOUCHDOWN!"></st-game-over>

    <!-- Touch controls -->
    <div class="controls" id="controls">
      <button id="thrust" aria-label="Thrust">THRUST</button>
      <div class="dpad-row">
        <button id="left" aria-label="Rotate left">↺</button>
        <button id="right" aria-label="Rotate right">↻</button>
      </div>
    </div>

    <script type="module" src="phobos-lander.js"></script>
  </body>
</html>
