<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pensamientos</title>
    <!-- Privat underside — samme regler som /gio: noindex her, ingen
         robots.txt-regel, udeladt af sitemap, ingen links hertil udefra.
         Rammen er spansk; selve indlæggene skrives på engelsk og bærer
         lang="en" i thoughts.js. -->
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <!-- Brevene sættes i Lora — en varm, litterær serif. Kun denne side
         henter den; resten af sitet kender kun Archivo Black + Space Mono. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&display=swap"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap"
    />
    <link href="../../css/all.min.css" rel="stylesheet" />
    <script type="module" crossorigin src="../../assets/gio/thoughts/index-Bcd0_RCx.js"></script>
    <link rel="modulepreload" crossorigin href="../../assets/tailwind-CX4d6OwZ.js">
    <link rel="modulepreload" crossorigin href="../../assets/firebase-config-CE95sHti.js">
    <link rel="modulepreload" crossorigin href="../../assets/gate-qPdJeSUb.js">
    <link rel="stylesheet" crossorigin href="../../assets/tailwind-DIQ9uPrw.css">
  </head>
  <body class="min-h-screen bg-bg-deep font-mono text-ink">
    <!-- Varmt skær nederst — samme sol som på forsiden, bare i det fjerne -->
    <div
      aria-hidden="true"
      class="pointer-events-none fixed inset-0 bg-[radial-gradient(120%_70%_at_50%_115%,color-mix(in_srgb,var(--color-hall-city-light)_22%,transparent),color-mix(in_srgb,var(--color-red)_5%,transparent)_45%,transparent_70%)]"
    ></div>

    <!-- Kun tilbage-pilen — titlen står i selve siden, ikke i en pille -->
    <div class="fixed top-0 right-0 left-0 z-20 flex items-center gap-3 p-4">
      <a
        href="../"
        aria-label="Volver a Gio"
        class="flex h-11 w-11 shrink-0 items-center justify-center rounded-pill border-[1.5px] border-border-strong bg-pill-bg text-lg backdrop-blur-[3px] transition-colors hover:border-border-hover focus-visible:outline-2 focus-visible:outline-accent"
        >←</a
      >
    </div>

    <!-- Det store svævende hjerte med Gio indeni — tegnes af thoughts.js.
         Bor i en strimmel øverst på SIDEN (absolute, ikke fixed): det
         svæver blidt deroppe og bliver deroppe — det følger ikke med ned
         og forsvinder aldrig bag brevene under scroll. -->
    <canvas
      id="corazon"
      class="pointer-events-none absolute top-0 left-0 h-[320px] w-full"
      aria-hidden="true"
    ></canvas>

    <main
      class="relative mx-auto flex min-h-screen w-full max-w-xl flex-col gap-10 px-6 pt-24 pb-16"
      hidden
    >
      <!-- Løbende refleksioner — ingen læst/ulæst, ingen dagslås. Det er
           en strøm hun kan dykke ned i, når hun vil. -->
      <header class="flex flex-col items-center gap-2.5 text-center">
        <p class="font-display text-2xl tracking-wide">PENSAMIENTOS</p>
        <!-- Dedikationen i brevets egen skrift — varm, ikke maskinel -->
        <p class="text-[15px] text-text-muted italic [font-family:Lora,Georgia,serif]">
          reflexiones que lanzo al universo — y a ti
        </p>
        <!-- Siden skal udstråle at der løbende kommer nyt — varm og læsbar,
             ikke en fodnote -->
        <p
          class="text-xs tracking-wide lowercase text-[color-mix(in_srgb,var(--color-hall-city-light)_45%,var(--color-text-muted))]"
        >
          siempre hay una nueva en camino · vuelve pronto
        </p>
      </header>

      <section id="feed" class="flex flex-col gap-4" aria-label="Pensamientos"></section>
    </main>

  </body>
</html>
