name: Deploy GitHub Pages

on:
  pull_request:
    branches: ["main"]
    types: [ synchronize, reopened, closed, opened ]
  workflow_dispatch:

concurrency:
  group: gh-pages-write
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist

      - name: Deploy to GitHub Pages (production)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          destination_dir: .
          keep_files: true
          commit_message: "Deploy production: ${{ github.event.pull_request.merge_commit_sha || github.sha }}"
