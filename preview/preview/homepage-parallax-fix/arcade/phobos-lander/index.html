<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phobos Lander</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script type="module" crossorigin src="../../assets/arcade/phobos-lander/index-CtF6sDtj.js"></script>
    <link rel="modulepreload" crossorigin href="../../assets/tailwind-CQTSFH_G.js">
    <link rel="modulepreload" crossorigin href="../../assets/firebase-config-CLc0baU0.js">
    <link rel="modulepreload" crossorigin href="../../assets/score-submit-C2yMQjp8.js">
    <link rel="stylesheet" crossorigin href="../../assets/tailwind-Bi-9WWH3.css">
    <link rel="stylesheet" crossorigin href="../../assets/index-CD2YqOT1.css">
  </head>
  <body>
    <canvas id="game" aria-hidden="true"></canvas>

    <!-- Top bar: back link + title badge (left), score + best (right) -->
    <div class="topbar">
      <div class="topbar-group">
        <a href="../../arcade/" class="pill link">← Arcade</a>
        <div class="pill badge">
          <span class="beacon"></span>
          PHOBOS LANDER
        </div>
      </div>
      <div class="topbar-group">
        <div class="pill stat">FUEL <strong id="fuel">100</strong>%</div>
        <div class="pill stat">SCORE <strong id="score">0</strong></div>
        <a class="pill stat" href="../../scoreboard/">BEST <strong id="best" class="best-val">0</strong></a>
      </div>
    </div>

    <!-- Intro card -->
    <div class="intro-container">
      <div class="intro" id="intro">
        <div class="intro-title">PHOBOS LANDER</div>
        <div class="intro-body">
          Space / W to thrust. A / D or ← / → to rotate. Land gently on a pad to score.
        </div>
      </div>
    </div>

    <!-- Game over sign -->
    <div id="gameOver" class="gameover">
      <div class="gameover-card">
        <div id="gameOverTitle" class="gameover-title">TOUCHDOWN!</div>
        <div class="gameover-sub">Press R or Tap</div>
        <button id="gameOverRestart" class="restart-btn" type="button">Restart</button>
      </div>
    </div>

    <!-- Touch controls -->
    <div class="controls" id="controls">
      <button id="thrust" aria-label="Thrust">THRUST</button>
      <div class="dpad-row">
        <button id="left" aria-label="Rotate left">↺</button>
        <button id="right" aria-label="Rotate right">↻</button>
      </div>
    </div>

  </body>
</html>
